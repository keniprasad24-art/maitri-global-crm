{% extends "base.html" %}

{% block content %}

<h2>Invoice List</h2>
<hr>

<a href="{% url 'add_invoice' %}" style="padding:8px 15px;background:blue;color:white;text-decoration:none;border-radius:5px;">
    Add Invoice
</a>

<br><br>

<table border="1" cellpadding="10" cellspacing="0" width="100%">
    <thead>
        <tr>
            <th>ID</th>
            <th>Invoice No</th>
            <th>Customer</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody>
    {% for i in invoices %}
        <tr>
            <td>{{ i.id }}</td>
            <td>{{ i.invoice_no }}</td>
            <td>{{ i.customer }}</td>
            <td>{{ i.amount }}</td>
            <td>{{ i.status }}</td>
            <td>
                <a href="{% url 'edit_invoice' i.id %}">Edit</a> |
                <a href="{% url 'delete_invoice' i.id %}" onclick="return confirm('Are you sure?')">Delete</a>
            </td>
        </tr>
    {% empty %}
        <tr>
            <td colspan="6" style="text-align:center;">No Invoices Found</td>
        </tr>
    {% endfor %}
    </tbody>
</table>

{% endblock %}
