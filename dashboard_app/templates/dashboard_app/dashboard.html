<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }
        .navbar{
            background:#0d6efd;
        }
        .card{
            border:none;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,.15);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">CRM Dashboard</span>
    </div>
</nav>

<div class="container mt-4">

    <div class="row">

        <div class="col-md-4 mb-3">
            <div class="card text-center p-3">
                <h5>Total Leads</h5>
                <h2>{{ lead_count }}</h2>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card text-center p-3">
                <h5>Companies</h5>
                <h2>{{ company_count }}</h2>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card text-center p-3">
                <h5>Contacts</h5>
                <h2>{{ contact_count }}</h2>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card text-center p-3">
                <h5>Opportunities</h5>
                <h2>{{ opportunity_count }}</h2>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card text-center p-3">
                <h5>Quotations</h5>
                <h2>{{ quotation_count }}</h2>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card text-center p-3">
                <h5>Invoices</h5>
                <h2>{{ invoice_count }}</h2>
            </div>
        </div>

    </div>

</div>

</body>
</html>
