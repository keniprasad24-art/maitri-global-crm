{% extends "base.html" %}

{% block content %}

<h2>Quotation List</h2>

<br>

<a href="/quotations/add/" style="padding:8px 15px;background:blue;color:white;text-decoration:none;">
    Add Quotation
</a>

<br><br>

<table border="1" cellpadding="10" cellspacing="0" width="100%">
    <tr>
        <th>ID</th>
        <th>Quotation No</th>
        <th>Customer</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for q in quotations %}
    <tr>
        <td>{{ q.id }}</td>
        <td>{{ q.quote_number }}</td>
        <td>{{ q.customer_name }}</td>
        <td>₹{{ q.amount }}</td>
        <td>{{ q.status }}</td>
        <td>
            <a href="/quotations/edit/{{ q.id }}/">Edit</a> |
            <a href="/quotations/delete/{{ q.id }}/"
               onclick="return confirm('Delete this quotation?')">
               Delete
            </a>
        </td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
